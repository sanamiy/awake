<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Keep tasks running with your Mac closed. One keyboard shortcut to lock your screen and prevent sleep.">
  <title>Awake — Close your Mac. Keep it running.</title>
  <link rel="stylesheet" href="awake.css">
</head>
<body>
  <main class="slide" aria-labelledby="headline">
    <p class="brand"><img class="brand-icon" src="../icon/icon-1024.png" alt="" width="1024" height="1024">Awake</p>
    <section class="copy">
      <h1 id="headline"><span>Close your Mac.</span><span>Keep it running.</span></h1>
      <!-- Local Lucide icons. See THIRD_PARTY_NOTICES.md for source and licenses. -->
      <p class="feature"><span class="feature-intro">One keyboard shortcut.</span><strong>
        <span class="feature-label">
          <img class="feature-icon" src="icons/lock.svg" alt="" aria-hidden="true" width="24" height="24">Lock screen
        </span>
        <span class="feature-connector">and</span>
        <span class="feature-label sleep">
          <img class="feature-icon" src="icons/sun.svg" alt="" aria-hidden="true" width="24" height="24">Prevent sleep
        </span>
      </strong></p>
    </section>
    <!-- Generated product illustration, not an official Apple product photograph. -->
    <img class="art" src="macbook.png" alt="A floating, half-closed MacBook with a glowing lock screen and softly lit Control, Command, and W keys." width="1536" height="1024">
  </main>

</html>
